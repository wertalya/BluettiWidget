name: Windows checks and preview build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Model tests
        run: |
          .\.venv\Scripts\python.exe test_models.py
          .\.venv\Scripts\python.exe test_feedback.py
          .\.venv\Scripts\python.exe test_updates.py
      - name: Build and run offline checks
        shell: pwsh
        run: |
          .\build.ps1
          .\.venv\Scripts\python.exe build_portable.py
          if (Test-Path portable/settings.ini) { throw 'Personal settings must not be in a release' }
      - name: Build and verify installer
        shell: pwsh
        run: |
          .\build_installer.ps1
          $installDir = Join-Path $env:RUNNER_TEMP 'BluettiWidget-setup-smoke'
          $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'BluettiWidget.lnk'
          $setupArguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/SP-', '/NORESTART', "/DIR=`"$installDir`"")
          $setup = Start-Process .\dist\installer\BluettiWidget-Setup.exe -ArgumentList $setupArguments -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed ($($setup.ExitCode))" }
          try {
            if (Test-Path (Join-Path $installDir 'settings.ini')) { throw 'Setup shipped a personal configuration' }
            if (-not (Test-Path -LiteralPath $startup)) { throw 'Startup shortcut was not created by default' }
            $link = (New-Object -ComObject WScript.Shell).CreateShortcut($startup)
            if ($link.TargetPath -ne (Join-Path $installDir 'BluettiWidget.exe') -or $link.Arguments -ne '--autostart') {
              throw 'Unexpected startup shortcut'
            }
            # Re-running Setup is the supported upgrade path and must preserve preferences.
            $settings = Join-Path $installDir 'settings.ini'
            $before = "[General]`nsize=S`nshow_on_startup=false`n[capacity_wh]`nAC180=1152`n"
            [IO.File]::WriteAllText($settings, $before)
            $upgrade = Start-Process .\dist\installer\BluettiWidget-Setup.exe -ArgumentList $setupArguments -Wait -PassThru
            if ($upgrade.ExitCode -ne 0) { throw "Upgrade failed ($($upgrade.ExitCode))" }
            if ([IO.File]::ReadAllText($settings) -cne $before) { throw 'Upgrade changed user settings' }
          } finally {
            $uninstall = Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed ($($uninstall.ExitCode))" }
          }
          if (Test-Path -LiteralPath $startup) { throw 'Uninstall left the startup shortcut behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: BluettiWidget-Windows-setup
          path: dist/installer/BluettiWidget-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BluettiWidget-Windows-preview
          path: |
            portable/BluettiWidget.exe
            LICENSE
            THIRD_PARTY.md
            README.md
            README.uk.md
            settings.example.ini
            docs/compatibility.md
