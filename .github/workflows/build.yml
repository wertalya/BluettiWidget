name: Перевірки та збірка для Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установлення залежностей
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Збірка та перевірки без станції
        shell: pwsh
        run: |
          .\scripts\build.ps1
          .\.venv\Scripts\python.exe -m scripts.build_portable
          if (Test-Path portable/settings.ini) { throw 'Особисті налаштування не повинні потрапляти до випуску' }
          foreach ($variant in @('dist/BluettiWidget/BluettiWidget.exe', 'portable/BluettiWidget.exe')) {
            $capture = Join-Path $env:RUNNER_TEMP (([guid]::NewGuid().ToString()) + '.png')
            $arguments = @('--render', ('"' + $capture + '"'))
            $app = Start-Process -FilePath $variant -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (-not $app.WaitForExit(40000)) { Stop-Process -Id $app.Id; throw 'Перевірка запуску EXE перевищила час очікування' }
            $app.Refresh()
            if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $capture)) { throw 'Готовий EXE не зміг відобразити віджет' }
          }
      - name: Збірка та перевірка інсталятора
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1
          $installDir = Join-Path $env:RUNNER_TEMP 'BluettiWidget-setup-smoke'
          $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'BluettiWidget.lnk'
          $setupArguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/SP-', '/NORESTART', "/DIR=`"$installDir`"")
          $setup = Start-Process .\dist\installer\BluettiWidget-Setup.exe -ArgumentList $setupArguments -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Помилка встановлення ($($setup.ExitCode))" }
          try {
            if (Test-Path (Join-Path $installDir 'settings.ini')) { throw 'Інсталятор містить особисті налаштування' }
            if (-not (Test-Path -LiteralPath $startup)) { throw 'Ярлик автозапуску не створено' }
            $link = (New-Object -ComObject WScript.Shell).CreateShortcut($startup)
            if ($link.TargetPath -ne (Join-Path $installDir 'BluettiWidget.exe') -or $link.Arguments -ne '--autostart') {
              throw 'Некоректний ярлик автозапуску'
            }
            # Re-running Setup is the supported upgrade path and must preserve preferences.
            $settings = Join-Path $installDir 'settings.ini'
            $before = "[General]`nsize=S`nshow_on_startup=false`n[capacity_wh]`nAC180=1152`n"
            [IO.File]::WriteAllText($settings, $before)
            $upgrade = Start-Process .\dist\installer\BluettiWidget-Setup.exe -ArgumentList $setupArguments -Wait -PassThru
            if ($upgrade.ExitCode -ne 0) { throw "Помилка оновлення ($($upgrade.ExitCode))" }
            if ([IO.File]::ReadAllText($settings) -cne $before) { throw 'Оновлення змінило налаштування користувача' }
          } finally {
            $uninstall = Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Помилка видалення ($($uninstall.ExitCode))" }
          }
          if (Test-Path -LiteralPath $startup) { throw 'Після видалення залишився ярлик автозапуску' }
      - uses: actions/upload-artifact@v4
        with:
          name: BluettiWidget-Windows-setup
          path: dist/installer/BluettiWidget-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BluettiWidget-Windows-preview
          path: |
            portable/BluettiWidget.exe
            LICENSE
            docs/THIRD_PARTY.md
            README.md
            docs/README.uk.md
            examples/settings.example.ini
            docs/compatibility.md
