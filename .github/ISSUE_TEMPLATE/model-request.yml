name: Допомогти з підтримкою моделі
description: Поділіться параметрами станції та результатами перевірки.
title: "[Модель] "
body:
  - type: markdown
    attributes:
      value: Додавайте лише параметри моделі. Не публікуйте settings.ini, .env, Bluetooth-адреси, серійні номери, токени та необроблені журнали.
  - type: input
    id: model
    attributes:
      label: Модель BLUETTI
      placeholder: AC70
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Версія прошивки та BluettiWidget
  - type: input
    id: capacity
    attributes:
      label: Загальна встановлена ємність акумуляторів у Вт·год
      description: Урахуйте додаткові акумулятори. За можливості додайте посилання на джерело ємності.
  - type: textarea
    id: results
    attributes:
      label: Що працює на вашій станції?
      description: Опишіть пошук, заряд, вхідну та вихідну потужність і повторне підключення. Можна додати окремий параметр ємності моделі.
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Перевірені регістри або назви полів — за наявності
      description: Укажіть назви полів, діапазони регістрів, одиниці вимірювання та посилання на джерело.
