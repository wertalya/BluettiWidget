name: Повідомити про проблему
description: Проблема з віджетом, Bluetooth або роботою у Windows.
title: "[Проблема] "
body:
  - type: input
    id: environment
    attributes:
      label: Версія віджета, Windows і модель BLUETTI
      description: За можливості вкажіть прошивку. Не додавайте Bluetooth-адресу та серійний номер.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Що сталося та як це повторити?
      description: Опишіть свої дії, очікуваний результат і що відбулося натомість.
    validations:
      required: true
